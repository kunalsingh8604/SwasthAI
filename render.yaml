services:
  - type: web
    name: swasthai
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "22.12.0"
      - key: NODE_ENV
        value: production
      # Set these in the Render dashboard (do not commit secrets):
      # MONGODB_URI, JWT_SECRET, GROQ_API_KEY
